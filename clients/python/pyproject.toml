[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xap-client"
version = "0.1.0"
description = "HTTP client for a self-hosted XAP node (OpenAPI xap-1.0.0)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Vidimus Labs" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["xap_client*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
