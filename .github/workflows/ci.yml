name: ci
on:
  push:
  pull_request:

# Least privilege: this workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a full commit SHA (supply-chain hardening); the
      # trailing comment tracks the human-readable version. Dependabot
      # (.github/dependabot.yml) keeps these current.
      # fetch-depth: 0 so the gitleaks step below scans the whole history.
      # checkout defaults to a depth-1 clone, which leaves `gitleaks detect` —
      # a history scanner — with exactly one commit to look at. Making the
      # repository public exposes every commit ever made, so the scan has to
      # cover every commit ever made.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && echo 'run gofmt -w .' && exit 1)

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      # This module stopped being pure data when it began exposing the parts of
      # the specification an implementation is held to — the OpenAPI's
      # operations, §9.2's check registry. Those scanners are what downstream
      # gates compare against, so a broken one does not fail: it certifies
      # agreement with a document it never read. Their guards live here, in the
      # module that owns the documents, and have to run here.
      - name: test
        run: go test -race ./...

      # Multi-lang HTTP clients (clients/) — coverage of every OpenAPI
      # operationId plus Python/TS unit tests. Not crypto verification (xap-go).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: clients
        run: |
          cd clients/typescript && npm ci || npm install
          cd ../..
          ./clients/scripts/test-all.sh

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # gitleaks binary (MIT, no license) rather than the org-licensed Action.
      - name: gitleaks
        run: |
          # Installed from the Go module proxy rather than fetched from the
          # GitHub release host.
          #
          # The release download failed four times on 2026-08-12 across four
          # repositories — one 503 and three dropped connections — each a red
          # main unrelated to the code. Retries were added and did not help: the
          # last failure exhausted all five attempts and every one returned 503,
          # because retrying does not fix a host that is down.
          #
          # So this removes the failure domain instead of retrying it. Every job
          # here already depends on proxy.golang.org for `go build`, and
          # govulncheck already arrives this way, so gitleaks stops being the one
          # tool carrying its own availability risk. The module proxy verifies
          # the download against the checksum database, which is a stronger
          # guarantee than a SHA-256 pinned here by hand — and it installs
          # outside the checkout, so the tool is not part of what it scans.
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks detect --source . --no-banner --redact --exit-code 1
