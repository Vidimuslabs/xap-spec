name: codeql
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 3 * * 1'

# CodeQL dataflow analysis, uploaded to the Security tab (public-repo CodeQL).
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@08d09a53f0f5d694f253bd25732e4429c9e9337f # v3
        with:
          languages: go
          build-mode: autobuild
      - name: Analyze
        uses: github/codeql-action/analyze@08d09a53f0f5d694f253bd25732e4429c9e9337f # v3
        with:
          category: "/language:go"
