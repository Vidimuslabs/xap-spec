name: codeql
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 3 * * 1'

# CodeQL dataflow analysis. Results are saved as a SARIF artifact rather than
# uploaded to code scanning, so this runs on a PRIVATE repo without GitHub Advanced
# Security. `actions: read` lets CodeQL read workflow-run metadata; `upload: false`
# and `upload-database: false` avoid the code-scanning API (which needs GHAS on
# private repos). Once this repo is PUBLIC (free) or GHAS is enabled, switch to
# native Security-tab scanning: set `upload: true`, remove `output:` + the
# upload-artifact step.
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@08d09a53f0f5d694f253bd25732e4429c9e9337f # v3
        with:
          languages: go
          build-mode: autobuild
      - name: Analyze
        uses: github/codeql-action/analyze@08d09a53f0f5d694f253bd25732e4429c9e9337f # v3
        with:
          category: "/language:go"
          upload: false
          upload-database: false
          output: codeql-results
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif
          path: codeql-results
          if-no-files-found: warn
